$font = JetBrains Mono NerdFont
$idle_gradient_start = rgba(00ff00ff)
$idle_gradient_end = rgba(00ff00ff)
$success_gradient_start = rgba(00dd00ff)
$success_gradient_end = rgba(00dd00ff)
$failed_gradient_start = rgba(dd0000ff)
$failed_gradient_end = rgba(dd0000ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 3.5, linear
    animation = inputFieldDots, 1, 2, linear
	animation = inputFieldColors, 1, 3, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.7) # no fill

    outer_color = $idle_gradient_start $idle_gradient_end 45deg
    check_color = $success_gradient_start $success_gradient_end 135deg
    fail_color = $failed_gradient_start $failed_gradient_end 45deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL
    check_text = Authenticating...

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

